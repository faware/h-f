<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acesso restrito</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2f0;--card:#fff;--tx:#141414;--mut:#6b6b6b;--bd:#dcdcda;--ink:#111;--ink2:#2b2b2b;--warn:#8f5400;--warn2:#fbefd9;--err:#a8231b;--err2:#fae3e0;--ok:#1b6236;--ok2:#e1f0e5;--wa:#128c4a;--fd:"Chakra Petch",system-ui,sans-serif;--fb:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 var(--fb);background:var(--bg);color:var(--tx)}
header{background:var(--ink);color:#fff;padding:0 22px;display:flex;align-items:center;gap:26px;flex-wrap:wrap;min-height:64px}
.brand{display:flex;align-items:center;gap:14px;padding:12px 0}
.brand img{height:30px;display:block;filter:invert(1)}
.brand span{font:600 11px var(--fd);letter-spacing:.32em;text-transform:uppercase;color:#9b9b9b;border-left:1px solid #3a3a3a;padding-left:14px}
nav{display:flex;gap:2px;flex-wrap:wrap;flex:1}
nav button{background:transparent;border:0;color:#a3a3a3;padding:22px 14px 21px;cursor:pointer;font:600 12.5px var(--fd);letter-spacing:.16em;text-transform:uppercase;position:relative}
nav button:hover{color:#fff}
nav button.on{color:#fff}
nav button.on::after{content:"";position:absolute;left:12px;right:12px;bottom:13px;height:3px;background:#fff;clip-path:polygon(4px 0,100% 0,calc(100% - 4px) 100%,0 100%)}
main{max-width:1180px;margin:0 auto;padding:24px 16px 60px}
.card{background:var(--card);border:1px solid var(--bd);padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
h2{font:700 15px var(--fd);letter-spacing:.12em;text-transform:uppercase;margin:0 0 14px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:16px;height:9px;background:var(--ink);clip-path:polygon(0 0,100% 0,78% 100%,0 100%);flex:none}
h3{font:600 12px var(--fd);margin:0 0 10px;color:var(--mut);letter-spacing:.16em;text-transform:uppercase}
.btn{border:1.5px solid var(--ink);background:#fff;color:var(--ink);padding:8px 14px;border-radius:0;cursor:pointer;font:600 12px var(--fd);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
.btn:hover{background:#ececea}
.btn.p{background:var(--ink);color:#fff;clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);padding-right:18px}
.btn.p:hover{background:#333}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff;clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);padding-right:18px}
.btn.wa:hover{background:#0e7a40}
.btn.d{color:var(--err);border-color:#e3b2ad}
.btn.s{padding:5px 9px;font-size:11px}
.btn.s.p,.btn.s.wa{padding-right:13px;clip-path:polygon(0 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%)}
.btn:disabled{opacity:.5;cursor:wait}
input,select,textarea{font:inherit;font-size:14.5px;padding:8px 10px;border:1px solid #c9c9c6;border-radius:0;background:#fff;color:var(--tx);width:100%}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
label{display:block;font:600 11px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.full{grid-column:1/-1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--bd);padding:16px 16px 14px;position:relative}
.kpi::before{content:"";position:absolute;left:-1px;top:-1px;width:38px;height:4px;background:var(--ink);clip-path:polygon(0 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.kpi span{display:block;color:var(--mut);font:600 10.5px var(--fd);letter-spacing:.14em;text-transform:uppercase}
.kpi b{font:700 24px var(--fd);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}
th{font:600 10.5px var(--fd);color:var(--mut);letter-spacing:.14em;text-transform:uppercase;background:#fafaf8;border-bottom:1.5px solid var(--ink)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:#f8f8f6}
.tag{display:inline-block;padding:2px 10px 2px 8px;font:600 10.5px var(--fd);letter-spacing:.1em;text-transform:uppercase;clip-path:polygon(0 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.t-ok{background:var(--ok2);color:var(--ok)}.t-ab{background:var(--warn2);color:var(--warn)}.t-at{background:var(--err2);color:var(--err)}.t-in{background:#ebebe8;color:var(--mut)}
.acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.empty{color:var(--mut);text-align:center;padding:30px 10px}
.muted{color:var(--mut)}
.hint{font-size:13px;color:var(--mut);margin-top:6px}
a{color:var(--ink)}
#ov{position:fixed;inset:0;background:rgba(10,10,10,.55);display:none;align-items:flex-start;justify-content:center;padding:30px 12px;overflow:auto;z-index:10}
#ov.on{display:flex}
.mod{background:#fff;width:100%;max-width:660px;padding:22px;border-top:4px solid var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.mod.wide{max-width:840px}
.mod .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;font-size:14px}
.toast.on{opacity:1}
.msgitem{border:1px solid var(--bd);padding:10px;margin-bottom:10px}
.msgitem pre{white-space:pre-wrap;font:inherit;font-size:14px;margin:6px 0 8px;background:#f6f6f4;padding:8px;max-height:160px;overflow:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chips code{background:#ececea;padding:2px 7px;font-size:12px;cursor:pointer}
.cnpjbox{display:flex;gap:6px}
.cnpjbox input{flex:1}
#cnpjMsg{font-size:13px;margin-top:5px;min-height:18px}
#cnpjMsg.err{color:var(--err)}#cnpjMsg.ok{color:var(--ok)}
.lote-log{max-height:260px;overflow:auto;font-size:13.5px;border:1px solid var(--bd);padding:8px;margin-top:10px;background:#fafaf8}
.lote-log div{padding:2px 0}
.ano-wrap{overflow:auto;max-height:calc(100vh - 250px);min-height:200px}
table.ano{border-collapse:separate;border-spacing:0;min-width:1060px;width:100%}
.ano th,.ano td{padding:0;text-align:center;border-bottom:1px solid var(--bd)}
.ano thead th{position:sticky;top:0;z-index:2;padding:10px 4px;background:#fafaf8}
.ano thead th.cur{background:var(--ink);color:#fff}
.ano .nm{position:sticky;left:0;z-index:1;background:#fff;text-align:left;padding:7px 12px;min-width:210px;max-width:250px;border-right:1.5px solid var(--ink)}
.ano .nm b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ano .nm span{display:block;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ano thead th.nm{z-index:3;background:#fafaf8}
.cel{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;min-width:66px;height:44px;border:0;border-left:1px solid #ecece9;cursor:pointer;font:600 12.5px var(--fd);background:transparent;color:var(--ink);font-variant-numeric:tabular-nums}
.cel small{font:500 9px var(--fd);letter-spacing:.08em;opacity:.75;text-transform:uppercase}
.cel:hover{outline:2px solid var(--ink);outline-offset:-2px}
.cel.cp{background:var(--ok2);color:var(--ok);font-size:16px}
.cel.co{background:var(--warn2);color:var(--warn)}
.cel.ca{background:#f4cfca;color:#8f1d16;font-weight:700}
.cel.cn{color:#c4c4c0;font-size:16px}
.cel.cn:hover{color:var(--ink);background:#f1f1ee}
.ano .tt{padding:0 12px;font:600 12.5px var(--fd);white-space:nowrap;min-width:110px;text-align:right;border-left:1.5px solid var(--ink)}
.ano .tt.neg{color:var(--err);font-weight:700}
.ano tfoot td{position:sticky;bottom:0;background:#fafaf8;font:600 11.5px var(--fd);padding:7px 4px;border-top:1.5px solid var(--ink);z-index:1}
.ano tfoot tr:first-child td{bottom:31px}
.ano tfoot td.nm{z-index:2;background:#fafaf8;font:600 10.5px var(--fd);letter-spacing:.12em;text-transform:uppercase}
.ano .ft.ok{color:var(--ok)}.ano .ft.ab{color:var(--warn)}
.leg{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.leg i{font:600 11px var(--fd);font-style:normal;padding:3px 7px;margin-left:8px}
.leg i.cp{background:var(--ok2);color:var(--ok)}.leg i.co{background:var(--warn2);color:var(--warn)}.leg i.ca{background:#f4cfca;color:#8f1d16}.leg i.cn{background:#f1f1ee;color:#999}
/* Recibo */
.recibo{border:1.5px solid #111;padding:26px 30px 22px;font-family:var(--fb);color:#111;background:#fff;margin-bottom:14px}
.r-top{display:flex;justify-content:space-between;align-items:center;gap:18px;padding-bottom:14px;border-bottom:2px solid #111}
.r-logo{height:54px;max-width:55%;object-fit:contain}
.r-esc{text-align:right;font-size:11.5px;line-height:1.5;text-transform:uppercase;letter-spacing:.03em}
.r-esc b{font-family:var(--fd);font-size:13px;letter-spacing:.06em}
.r-title{display:flex;align-items:center;gap:14px;margin:18px 0 16px}
.r-title .t{font:700 22px var(--fd);letter-spacing:.3em;text-transform:uppercase}
.r-title .nr{font:600 13px var(--fd);letter-spacing:.12em;color:#444}
.r-title .v{margin-left:auto;font:700 19px var(--fd);border:2px solid #111;padding:5px 14px;letter-spacing:.04em}
.r-txt{font-size:14.5px;line-height:1.85;text-align:justify;text-transform:uppercase;margin:0 0 14px}
.r-meta{display:flex;gap:30px;flex-wrap:wrap;font-size:13px;text-transform:uppercase;letter-spacing:.03em}
.r-loc{text-align:right;margin:20px 0 40px;font-size:13.5px;text-transform:uppercase}
.r-ass{width:62%;margin:0 auto;text-align:center;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;line-height:1.5}
.r-ass .ln{border-top:1.5px solid #111;margin-bottom:6px}
.r-ass b{font-family:var(--fd);font-size:14px;letter-spacing:.06em}
.recibo .via{font:600 10px var(--fd);letter-spacing:.14em;color:#666;text-align:right;margin-top:12px;text-transform:uppercase}
.cut{border-top:1px dashed #888;margin:18px 0}
.pgb{break-after:page;page-break-after:always}.pgb:last-child{break-after:auto;page-break-after:auto}
#print{display:none}
/* Topo, login, sincronização */
.hdrR{display:flex;align-items:center;gap:10px;font-size:12.5px;color:#a3a3a3}
.hdrR button{background:transparent;border:1px solid #444;color:#fff;padding:5px 10px;cursor:pointer;font:600 11px var(--fd);letter-spacing:.12em;text-transform:uppercase}
.hdrR button:hover{border-color:#fff}
#sync{padding:3px 9px;background:#232323;white-space:nowrap;font-size:12px}
#sync.err,#sync.conf{background:var(--err2);color:var(--err)}
body:not(.logado) header{display:none}
.login{max-width:380px;margin:12vh auto 0}
.login .card{padding:28px;border-top:4px solid var(--ink)}
.login input{margin-bottom:14px}
.login .msg{color:var(--err);font-size:13px;min-height:18px;margin-bottom:6px}
.vers{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--bd)}
@media (max-width:640px){.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:19px}header{padding:0 14px;gap:6px}.brand img{height:24px}nav button{padding:14px 9px;font-size:11px}nav button.on::after{bottom:6px}.hdrR{width:100%;padding-bottom:10px}.r-top{flex-direction:column;align-items:flex-start}.r-esc{text-align:left}}
@media print{
  body{background:#fff}
  body>*:not(#print){display:none!important}
  #print{display:block}
  .recibo{page-break-inside:avoid;break-inside:avoid;padding:16px 22px 12px;margin-bottom:4px}
  .r-top{padding-bottom:10px}.r-logo{height:44px}.r-title{margin:12px 0 10px}.r-txt{line-height:1.65;margin-bottom:10px;font-size:13.5px}
  .r-loc{margin:12px 0 28px}.cut{margin:10px 0}.recibo .via{margin-top:6px}
  @page{margin:14mm}
}
</style>
</head>
<body>
<header>
  <div class="brand"><img id="hdrLogo" alt=""><span>Honorários</span></div><small id="hdrEsc" hidden></small>
  <nav id="nav">
    <button data-t="painel">Painel</button>
    <button data-t="honor">Honorários</button>
    <button data-t="ano">Mensalidades</button>
    <button data-t="clientes">Clientes</button>
    <button data-t="config">Configurações</button>
  </nav>
  <div class="hdrR"><span id="sync">✓ Salvo</span><span id="hdrUser"></span><button onclick="sair()">Sair</button></div>
</header>
<main id="app"></main>
<div id="ov"><div class="mod" id="mod"></div></div>
<div class="toast" id="toast"></div>
<div id="print"></div>
<input type="file" id="fileImp" accept=".json,application/json" style="display:none">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ================= Conexão com o Supabase =================
   Preencha com os dados do seu projeto (Project Settings → API).
   Se deixar em branco, o sistema pede esses dados na primeira vez que abrir. */
const SUPABASE_URL='https://jfmmasdsfhfqrmlsxdgs.supabase.co';   // ex.: https://abcdefgh.supabase.co
const SUPABASE_KEY='sb_publishable_rBentRdpnrARPBSbedFUtg_3jeXTEa5';   // chave "publishable" ou "anon public" (NUNCA a service_role / secret)

/* ================= Dados ================= */
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const TPL_PADRAO={
  lembrete:"Olá, {cliente}! Tudo bem?\n\nPassando para lembrar que os honorários contábeis referentes a *{competencia}*, no valor de *{valor}*, vencem em *{vencimento}*.\n\nChave PIX: {pix}\n\nQualquer dúvida, estou à disposição.\n{escritorio}",
  atraso:"Olá, {cliente}! Tudo bem?\n\nConsta em aberto o pagamento dos honorários contábeis de *{competencia}*, no valor de *{valor}*, com vencimento em *{vencimento}*.\n\nSe já pagou, por favor desconsidere esta mensagem e nos envie o comprovante. 🙏\n\nChave PIX: {pix}\n\n{escritorio}",
  pago:"Olá, {cliente}! Confirmamos o recebimento dos honorários contábeis de *{competencia}*, no valor de *{valor}*, pago em {pagamento}.\n\nRecibo nº {recibo}.\n\nObrigado pela confiança!\n{escritorio}"
};
function blank(){return{config:{nome:'',doc:'',crc:'',resp:'',end:'',cidade:'',fone:'',email:'',pix:'',vencMesSeguinte:true,duasVias:true,tpl:{...TPL_PADRAO}},clientes:[],lanc:[],seq:1,ultBackup:null}}
function normalize(d){const b=blank();if(!d||typeof d!=='object')return b;
  const tpl=Object.assign({},TPL_PADRAO,(d.config&&d.config.tpl)||{});
  d.config=Object.assign({},b.config,d.config||{});d.config.tpl=tpl;
  return Object.assign(b,d)}
let db=blank();
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ================= Sincronização ================= */
let sb=null,userId=null,rev=0,salvando=false,pendente=false,erroRede=false,conflito=false,timer=null;
function sbCfg(){if(SUPABASE_URL&&SUPABASE_KEY)return{url:SUPABASE_URL,key:SUPABASE_KEY,fixo:true};
  try{return JSON.parse(localStorage.getItem('honorarios_sb')||'null')}catch(e){return null}}
function setSync(s){const el=document.getElementById('sync');if(!el)return;el.className=s;
  el.textContent={ok:'✓ Salvo na nuvem',pend:'Alterações pendentes…',saving:'Salvando…',err:'⚠ Sem conexão — tentando de novo',conf:'⚠ Conflito de versões'}[s]||s}
function save(){pendente=true;setSync('pend');clearTimeout(timer);timer=setTimeout(push,700)}
async function push(){
  if(salvando||conflito||!userId)return;salvando=true;pendente=false;erroRede=false;setSync('saving');
  try{
    if(rev===0){const r=await sb.from('honorarios').insert({user_id:userId,data:db,rev:1}).select('rev');
      if(r.error){if(r.error.code==='23505'){await onConflict();return}throw r.error}rev=1}
    else{const r=await sb.from('honorarios').update({data:db,rev:rev+1,updated_at:new Date().toISOString()}).eq('user_id',userId).eq('rev',rev).select('rev');
      if(r.error)throw r.error;if(!r.data.length){await onConflict();return}rev++}
    if(!pendente)setSync('ok');
  }catch(e){console.error(e);pendente=true;erroRede=true;setSync('err')}
  finally{salvando=false;if(pendente&&!conflito){clearTimeout(timer);timer=setTimeout(push,erroRede?5000:300)}}}
async function onConflict(){conflito=true;setSync('conf');
  const usarServidor=confirm('Os dados foram alterados em outro aparelho ou aba depois que você abriu o sistema aqui.\n\nOK = carregar a versão mais recente da nuvem (sua última alteração nesta tela será descartada).\nCancelar = manter o que está nesta tela e sobrescrever a versão da nuvem.');
  const {data,error}=await sb.from('honorarios').select('data,rev').eq('user_id',userId).maybeSingle();
  if(error){alert('Erro ao consultar a nuvem: '+error.message);location.reload();return}
  if(usarServidor){db=normalize(data&&data.data);rev=data?data.rev:0;pendente=false;conflito=false;setSync('ok');render();toast('Versão da nuvem carregada.')}
  else{rev=data?data.rev:0;conflito=false;pendente=true;setTimeout(push,100)}}
window.addEventListener('beforeunload',e=>{if(pendente||salvando){e.preventDefault();e.returnValue=''}});
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible'||!userId||pendente||salvando||conflito)return;
  const {data}=await sb.from('honorarios').select('data,rev').eq('user_id',userId).maybeSingle();
  if(data&&data.rev>rev&&!pendente&&!salvando){db=normalize(data.data);rev=data.rev;render();toast('Dados atualizados com alterações de outro aparelho.')}});

/* ================= Login ================= */
async function boot(){
  const cfg=sbCfg();if(!cfg){telaConexao();return}
  if(!window.supabase){$('#app').innerHTML='<div class="login"><div class="card">Não foi possível carregar o Supabase. Verifique sua internet e recarregue a página.</div></div>';return}
  try{sb=window.supabase.createClient(cfg.url,cfg.key)}catch(e){alert('Endereço ou chave do Supabase inválidos.');localStorage.removeItem('honorarios_sb');telaConexao();return}
  const {data:{session}}=await sb.auth.getSession();
  if(session)await iniciar(session.user);else telaLogin()}
function telaConexao(){
  $('#app').innerHTML=`<div class="login"><div class="card"><h2>Conectar ao Supabase</h2>
  <p class="muted" style="margin-top:-6px">Copie em Project Settings → API do seu projeto. Isso fica salvo só neste navegador.</p>
  <label>Project URL</label><input id="sUrl" placeholder="https://xxxx.supabase.co">
  <label>Chave publishable (ou anon public)</label><input id="sKey">
  <div class="hint" style="margin:-6px 0 12px">Nunca use a chave secret / service_role aqui.</div>
  <button class="btn p" style="width:100%" onclick="salvarConexao()">Conectar</button></div></div>`}
function salvarConexao(){const url=$('#sUrl').value.trim().replace(/\/+$/,''),key=$('#sKey').value.trim();
  if(!/^https:\/\/.+/.test(url)||!key){alert('Preencha a URL (começando com https://) e a chave.');return}
  localStorage.setItem('honorarios_sb',JSON.stringify({url,key}));boot()}
function telaLogin(){const cfg=sbCfg();
  $('#app').innerHTML=`<div class="login"><div class="card"><h2>🔒 Acesso restrito</h2><p class="muted" style="margin-top:-6px">Entre com seu usuário e senha.</p>
  <form onsubmit="entrar();return false"><label>E-mail</label><input id="lEmail" type="email" autocomplete="username" required>
  <label>Senha</label><input id="lSenha" type="password" autocomplete="current-password" required>
  <div class="msg" id="lMsg"></div><button class="btn p" style="width:100%" id="lBtn">Entrar</button></form>
  ${cfg&&!cfg.fixo?`<p class="hint" style="text-align:center;margin-top:14px"><a href="#" onclick="localStorage.removeItem('honorarios_sb');location.reload();return false">Trocar projeto Supabase</a></p>`:''}
  </div></div>`;$('#lEmail').focus()}
async function entrar(){const btn=$('#lBtn');btn.disabled=true;btn.textContent='Entrando…';$('#lMsg').textContent='';
  const {data,error}=await sb.auth.signInWithPassword({email:$('#lEmail').value.trim(),password:$('#lSenha').value});
  if(error){btn.disabled=false;btn.textContent='Entrar';$('#lMsg').textContent=/invalid/i.test(error.message)?'E-mail ou senha incorretos.':error.message;return}
  await iniciar(data.user)}
async function iniciar(user){
  userId=user.id;$('#app').innerHTML='<div class="empty">Carregando…</div>';
  const {data,error}=await sb.from('honorarios').select('data,rev').eq('user_id',userId).maybeSingle();
  if(error){$('#app').innerHTML=`<div class="login"><div class="card"><h2>Erro ao carregar</h2><p>${esc(error.message)}</p><p class="muted">Confira se você rodou o script <b>supabase.sql</b> no SQL Editor do projeto.</p><button class="btn" onclick="sair()">Sair</button></div></div>`;return}
  if(data){db=normalize(data.data);rev=data.rev}else{db=blank();rev=0}
  $('#hdrUser').textContent=user.email;document.title='Controle de Honorários';document.body.classList.add('logado');render();setSync('ok')}
async function sair(){if(pendente||salvando){if(!confirm('Ainda há alterações sendo salvas. Sair mesmo assim?'))return}
  await sb.auth.signOut();location.reload()}

/* ================= Versões salvas (histórico na nuvem) ================= */
async function carregarVersoes(){const el=$('#versoes');if(!el)return;
  const {data,error}=await sb.from('honorarios_historico').select('id,rev,salvo_em').eq('user_id',userId).order('salvo_em',{ascending:false}).limit(40);
  if(error){el.innerHTML='<span class="muted">Não foi possível listar as versões: '+esc(error.message)+'</span>';return}
  el.innerHTML=data.length?data.map(v=>`<div class="vers"><span>${new Date(v.salvo_em).toLocaleString('pt-BR')}</span><span class="muted">rev. ${v.rev}</span><span class="sp"></span><button class="btn s" onclick="restaurarVersao(${v.id})">Restaurar</button></div>`).join('')
    :'<span class="muted">Nenhuma versão anterior ainda. Elas aparecem conforme você usa o sistema (no máximo uma por hora).</span>'}
async function restaurarVersao(id){
  if(!confirm('Restaurar esta versão? Os dados atuais serão substituídos por ela.\n\nDica: baixe um backup antes, por segurança.'))return;
  const {data,error}=await sb.from('honorarios_historico').select('data').eq('id',id).single();
  if(error){alert(error.message);return}db=normalize(data.data);save();render();toast('Versão restaurada.')}

/* ================= Utilidades ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function parseMoney(s){s=String(s??'').replace(/[R$\s]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?0:Math.round(n*100)/100}
const moneyIn=v=>(Number(v)||0).toFixed(2).replace('.',',');
const pad=n=>String(n).padStart(2,'0');
function hoje(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function compAtual(){return hoje().slice(0,7)}
function fmtData(iso){if(!iso)return'';const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y}
function fmtComp(c){if(!c)return'';const[y,m]=c.split('-');return MESES[+m-1]+'/'+y}
function dataExtenso(iso){const[y,m,d]=iso.split('-');return (+d)+' de '+MESES[+m-1]+' de '+y}
function calcVenc(comp,dia){let[y,m]=comp.split('-').map(Number);if(db.config.vencMesSeguinte){m++;if(m>12){m=1;y++}}
  const ult=new Date(y,m,0).getDate();const d=Math.min(Math.max(+dia||10,1),ult);return y+'-'+pad(m)+'-'+pad(d)}
const recNum=n=>String(n).padStart(4,'0');
function soDigitos(s){return String(s||'').replace(/\D/g,'')}
function waNum(f){let d=soDigitos(f);if(!d)return'';if(d.length<=11)d='55'+d;return d}
function cli(id){return db.clientes.find(c=>c.id===id)||{nome:'(cliente excluído)'}}
function status(l){if(l.status==='pago')return'pago';return l.venc<hoje()?'atrasado':'aberto'}
function tagStatus(l){const s=status(l);return s==='pago'?'<span class="tag t-ok">Pago</span>':s==='atrasado'?'<span class="tag t-at">Atrasado</span>':'<span class="tag t-ab">Em aberto</span>'}
function toast(t){const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2200)}
async function copiar(txt){
  try{await navigator.clipboard.writeText(txt);toast('Mensagem copiada! Agora é só colar no WhatsApp.')}
  catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Mensagem copiada!')}catch(_){alert('Não consegui copiar automaticamente. Selecione o texto e copie com Ctrl+C.')}ta.remove()}}

/* Valor por extenso */
const UN=['','um','dois','três','quatro','cinco','seis','sete','oito','nove','dez','onze','doze','treze','quatorze','quinze','dezesseis','dezessete','dezoito','dezenove'];
const DZ=['','','vinte','trinta','quarenta','cinquenta','sessenta','setenta','oitenta','noventa'];
const CT=['','cento','duzentos','trezentos','quatrocentos','quinhentos','seiscentos','setecentos','oitocentos','novecentos'];
function ate999(n){if(!n)return'';if(n===100)return'cem';const c=Math.floor(n/100),r=n%100,p=[];if(c)p.push(CT[c]);
  if(r){if(r<20)p.push(UN[r]);else{const d=Math.floor(r/10),u=r%10;p.push(u?DZ[d]+' e '+UN[u]:DZ[d])}}return p.join(' e ')}
function inteiroExt(n){if(!n)return'zero';const mi=Math.floor(n/1e6),mil=Math.floor(n%1e6/1000),r=n%1000,p=[];
  if(mi)p.push(mi===1?'um milhão':ate999(mi)+' milhões');if(mil)p.push(mil===1?'mil':ate999(mil)+' mil');
  if(r)p.push(ate999(r));if(p.length<2)return p.join('');const last=p.pop();const sep=(r&&(r<100||r%100===0))?' e ':' ';return p.join(' ')+sep+last}
function extenso(v){v=Math.round((Number(v)||0)*100);const re=Math.floor(v/100),ce=v%100;let s='';
  if(re){s=inteiroExt(re);const mi=Math.floor(re/1e6);s+=(mi&&re%1e6===0)?' de reais':re===1?' real':' reais'}
  if(ce){s+=(s?' e ':'')+ate999(ce)+(ce===1?' centavo':' centavos')}return s||'zero real'}

let tab='painel',fComp=compAtual(),fStatus='todos',fBusca='',pComp=compAtual(),cBusca='',cAtivos='ativos';
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render()});
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#hdrEsc').textContent=db.config.nome?'· '+db.config.nome:'';aplicarLogo();
  ({painel:rPainel,honor:rHonor,ano:rAno,clientes:rClientes,config:rConfig})[tab]()}

/* ================= Painel ================= */
function rPainel(){
  const ls=db.lanc.filter(l=>l.comp===pComp);
  const prev=ls.reduce((a,l)=>a+l.valor,0),rec=ls.filter(l=>l.status==='pago').reduce((a,l)=>a+(l.valorPago??l.valor),0);
  const aberto=ls.filter(l=>l.status!=='pago').reduce((a,l)=>a+l.valor,0);
  const atr=db.lanc.filter(l=>status(l)==='atrasado').sort((a,b)=>a.venc.localeCompare(b.venc));
  const totAtr=atr.reduce((a,l)=>a+l.valor,0);
  const ativos=db.clientes.filter(c=>c.ativo).length;
  const semGerar=db.clientes.filter(c=>c.ativo&&!db.lanc.some(l=>l.cli===c.id&&l.comp===pComp&&!l.avulso)).length;
  const prox=db.lanc.filter(l=>status(l)==='aberto').sort((a,b)=>a.venc.localeCompare(b.venc)).slice(0,8);
  let aviso='';
  if(!db.config.nome)aviso+=`<div class="card" style="border-color:#f5c26b;background:#fffaeb">👋 Comece em <b>Configurações</b> com os dados do escritório (aparecem no recibo e nas mensagens) e depois cadastre seus clientes.</div>`;
  const dias=db.ultBackup?Math.floor((Date.now()-new Date(db.ultBackup))/864e5):null;
  if(db.clientes.length&&(dias===null||dias>=7))aviso+=`<div class="card" style="border-color:#f5c26b;background:#fffaeb" class="row">💾 ${dias===null?'Você ainda não fez nenhum backup.':'Último backup há '+dias+' dias.'} Os dados estão na nuvem, mas uma cópia sua é a garantia extra — <a href="#" onclick="exportar();return false">baixar backup agora</a>.</div>`;
  $('#app').innerHTML=aviso+`
  <div class="row" style="margin-bottom:14px"><h2 style="margin:0">Resumo da competência</h2><input type="month" value="${pComp}" style="width:auto" onchange="pComp=this.value;rPainel()"><span class="sp"></span>
  ${semGerar?`<button class="btn p" onclick="gerarMes('${pComp}')">Gerar honorários de ${fmtComp(pComp)} (${semGerar})</button>`:''}</div>
  <div class="kpis">
    <div class="kpi"><span>Previsto em ${fmtComp(pComp)}</span><b>${brl(prev)}</b></div>
    <div class="kpi"><span>Recebido</span><b style="color:var(--ok)">${brl(rec)}</b></div>
    <div class="kpi"><span>Em aberto</span><b style="color:var(--warn)">${brl(aberto)}</b></div>
    <div class="kpi"><span>Atrasados (todas as competências)</span><b style="color:var(--err)">${brl(totAtr)}</b><span>${atr.length} lançamento(s)</span></div>
    <div class="kpi"><span>Clientes ativos</span><b>${ativos}</b></div>
  </div>
  <div class="card"><div class="row" style="margin-bottom:8px"><h3 style="margin:0">Em atraso</h3><span class="sp"></span>${atr.length?`<button class="btn s wa" onclick="lote('atraso')">Avisos de atraso em lote</button>`:''}</div>
  ${tabelaLanc(atr,'Nenhum honorário em atraso. 🎉')}</div>
  <div class="card"><h3>Próximos vencimentos</h3>${tabelaLanc(prox,'Nada em aberto por enquanto.')}</div>`}

/* ================= Honorários ================= */
function rHonor(){
  let ls=db.lanc.filter(l=>!fComp||l.comp===fComp);
  if(fStatus!=='todos')ls=ls.filter(l=>status(l)===fStatus);
  if(fBusca){const b=fBusca.toLowerCase();ls=ls.filter(l=>cli(l.cli).nome.toLowerCase().includes(b))}
  ls.sort((a,b)=>cli(a.cli).nome.localeCompare(cli(b.cli).nome)||a.venc.localeCompare(b.venc));
  const tot=ls.reduce((a,l)=>a+l.valor,0);
  $('#app').innerHTML=`<div class="card">
  <div class="row" style="margin-bottom:12px">
    <div><label>Competência</label><input type="month" value="${fComp}" onchange="fComp=this.value;rHonor()" style="width:auto"></div>
    <div><label>Situação</label><select onchange="fStatus=this.value;rHonor()" style="width:auto">
      ${[['todos','Todas'],['aberto','Em aberto'],['atrasado','Atrasado'],['pago','Pago']].map(([v,t])=>`<option value="${v}"${fStatus===v?' selected':''}>${t}</option>`).join('')}</select></div>
    <div style="min-width:200px;flex:1"><label>Buscar cliente</label><input id="hb" value="${esc(fBusca)}" placeholder="Nome..." oninput="fBusca=this.value;rHonor();const e=$('#hb');e.focus();e.setSelectionRange(e.value.length,e.value.length)"></div>
  </div>
  <div class="row">
    ${fComp?`<button class="btn p" onclick="gerarMes('${fComp}')">Gerar honorários de ${fmtComp(fComp)}</button>`:''}
    <button class="btn" onclick="formLanc()">+ Lançamento avulso</button>
    ${fComp?`<button class="btn" onclick="imprimirLote()">🖨 Imprimir recibos do mês</button><button class="btn wa" onclick="lote('lembrete')">Lembretes do mês em lote</button>`:''}
    <span class="sp"></span><span class="muted">${ls.length} lançamento(s) · ${brl(tot)}</span>
  </div></div>
  <div class="card">${tabelaLanc(ls,fComp&&!db.lanc.some(l=>l.comp===fComp)?`Nenhum honorário gerado para ${fmtComp(fComp)}. Clique em <b>Gerar honorários</b> para criar os lançamentos de todos os clientes ativos.`:'Nenhum lançamento encontrado.')}</div>`}

function tabelaLanc(ls,vazio){
  if(!ls.length)return`<div class="empty">${vazio}</div>`;
  return`<div class="tw"><table><thead><tr><th>Cliente</th><th>Competência</th><th>Vencimento</th><th class="n">Valor</th><th>Situação</th><th style="text-align:right">Ações</th></tr></thead><tbody>
  ${ls.map(l=>{const c=cli(l.cli),pago=l.status==='pago';return`<tr>
    <td><b>${esc(c.nome)}</b>${l.desc?`<div class="muted" style="font-size:12px">${esc(l.desc)}</div>`:''}</td>
    <td>${fmtComp(l.comp)}</td><td>${fmtData(l.venc)}</td><td class="n">${brl(l.valor)}</td>
    <td>${tagStatus(l)}${pago?`<div class="muted" style="font-size:12px">${fmtData(l.pagoEm)} · Rec. ${recNum(l.recibo)}</div>`:l.recibo?`<div class="muted" style="font-size:12px">Recibo ${recNum(l.recibo)} emitido</div>`:''}</td>
    <td><div class="acts">
      ${pago?'':`<button class="btn s p" onclick="formPagar('${l.id}')">✓ Marcar pago</button>`}<button class="btn s" onclick="verRecibo('${l.id}')">🧾 Recibo</button>
      <button class="btn s wa" onclick="msg('${l.id}')">WhatsApp</button>
      <button class="btn s" title="Editar" onclick="formLanc('${l.id}')">✏️</button>
      <button class="btn s d" title="Excluir" onclick="delLanc('${l.id}')">🗑</button>
    </div></td></tr>`}).join('')}</tbody></table></div>`}

function gerarMes(comp){
  const ativos=db.clientes.filter(c=>c.ativo);
  if(!ativos.length){alert('Cadastre clientes ativos primeiro.');return}
  let n=0;ativos.forEach(c=>{if(!db.lanc.some(l=>l.cli===c.id&&l.comp===comp&&!l.avulso)){
    db.lanc.push({id:uid(),cli:c.id,comp,valor:c.valor,venc:calcVenc(comp,c.dia),desc:'',status:'aberto'});n++}});
  save();toast(n?`${n} honorário(s) gerado(s) para ${fmtComp(comp)}.`:'Todos os clientes ativos já têm honorário nesta competência.');render()}

function formLanc(id){
  const l=id?db.lanc.find(x=>x.id===id):null;
  const clis=db.clientes.filter(c=>c.ativo||(l&&c.id===l.cli)).sort((a,b)=>a.nome.localeCompare(b.nome));
  if(!clis.length){alert('Cadastre um cliente primeiro.');return}
  const comp=l?l.comp:(fComp||compAtual());
  modal(`<h2>${l?'Editar lançamento':'Lançamento avulso'}</h2>
  <div class="grid">
    <div class="full"><label>Cliente</label><select id="lCli" ${l?'disabled':''} onchange="lAuto()">${clis.map(c=>`<option value="${c.id}"${l&&l.cli===c.id?' selected':''}>${esc(c.nome)}</option>`).join('')}</select></div>
    <div><label>Competência</label><input type="month" id="lComp" value="${comp}" onchange="lAuto()"></div>
    <div><label>Vencimento</label><input type="date" id="lVenc" value="${l?l.venc:''}"></div>
    <div><label>Valor (R$)</label><input id="lVal" inputmode="decimal" value="${l?moneyIn(l.valor):''}"></div>
    <div class="full"><label>Descrição (opcional — aparece no recibo)</label><input id="lDesc" value="${esc(l?l.desc:'')}" placeholder="Ex.: Declaração de IRPF, 13º salário, abertura de empresa..."></div>
  </div>
  <div class="foot"><button class="btn" onclick="fechar()">Cancelar</button><button class="btn p" onclick="salvarLanc('${id||''}')">Salvar</button></div>`);
  if(!l)lAuto()}
function lAuto(){const c=cli($('#lCli').value);if(!$('#lVal').dataset.t){$('#lVal').value=moneyIn(c.valor)}$('#lVenc').value=calcVenc($('#lComp').value||compAtual(),c.dia)}
function salvarLanc(id){
  const v=parseMoney($('#lVal').value),comp=$('#lComp').value,venc=$('#lVenc').value;
  if(!comp||!venc||v<=0){alert('Preencha competência, vencimento e valor.');return}
  if(id){const l=db.lanc.find(x=>x.id===id);Object.assign(l,{comp,venc,valor:v,desc:$('#lDesc').value.trim()})}
  else db.lanc.push({id:uid(),cli:$('#lCli').value,comp,venc,valor:v,desc:$('#lDesc').value.trim(),status:'aberto',avulso:true});
  save();fechar();render();toast('Lançamento salvo.')}
function delLanc(id){const l=db.lanc.find(x=>x.id===id);
  if(!confirm(`Excluir o lançamento de ${cli(l.cli).nome} (${fmtComp(l.comp)})?${l.status==='pago'?'\n\nAtenção: ele já foi pago e tem recibo emitido.':''}`))return;
  db.lanc=db.lanc.filter(x=>x.id!==id);save();render()}

function formPagar(id){const l=db.lanc.find(x=>x.id===id),c=cli(l.cli);
  modal(`<h2>Marcar como pago</h2><p class="muted" style="margin-top:-6px">${esc(c.nome)} · ${fmtComp(l.comp)}</p>
  <div class="grid">
    <div><label>Data do pagamento</label><input type="date" id="pData" value="${hoje()}"></div>
    <div><label>Valor recebido (R$)</label><input id="pVal" inputmode="decimal" value="${moneyIn(l.valor)}"></div>
    <div><label>Forma de pagamento</label><select id="pForma">${['PIX','Dinheiro','Transferência','Boleto','Cartão','Cheque'].map(f=>`<option>${f}</option>`).join('')}</select></div>
  </div>
  <div class="foot"><button class="btn" onclick="fechar()">Cancelar</button><button class="btn p" onclick="pagar('${id}')">Confirmar pagamento</button></div>`)}
function pagar(id){const l=db.lanc.find(x=>x.id===id),v=parseMoney($('#pVal').value);
  if(!$('#pData').value||v<=0){alert('Informe data e valor.');return}
  Object.assign(l,{status:'pago',pagoEm:$('#pData').value,valorPago:v,forma:$('#pForma').value});
  if(!l.recibo){l.recibo=db.seq++}
  save();render();verRecibo(id)}
function estornar(id){if(!confirm('Desfazer este pagamento? O lançamento volta para "em aberto" (o número do recibo fica reservado).'))return;
  const l=db.lanc.find(x=>x.id===id);l.status='aberto';delete l.pagoEm;delete l.valorPago;delete l.forma;save();fechar();render()}

/* ================= Recibo ================= */
function reciboHTML(l,via){const c=cli(l.cli),e=db.config,pg=l.status==='pago',v=pg?(l.valorPago??l.valor):l.valor;
  const ref=l.desc?`a ${esc(l.desc)} — competência ${fmtComp(l.comp)}`:`aos serviços mensais prestados — competência ${fmtComp(l.comp)}${c.servicos?' ('+esc(c.servicos)+')':''}`;
  const cid=(e.cidade||'').split('/')[0].split('-')[0].trim();
  return`<div class="recibo">
  <div class="r-top">${e.logo?`<img class="r-logo" src="${e.logo}" alt="">`:`<b style="font:700 20px var(--fd);letter-spacing:.12em;text-transform:uppercase">${esc(e.nome||'')}</b>`}
    <div class="r-esc">${e.end?`<div>${esc(e.end)}${e.cidade?', '+esc(e.cidade):''}</div>`:''}
    ${e.resp?`<b>${esc(e.resp)}</b>`:''}<div>Contador${e.crc?' · CRC '+esc(e.crc):''}</div>
    ${e.doc?`<div>CPF/CNPJ ${esc(e.doc)}</div>`:''}${(e.fone||e.email)?`<div style="text-transform:none">${esc([e.fone,e.email].filter(Boolean).join(' · '))}</div>`:''}</div></div>
  <div class="r-title"><span class="t">Recibo</span><span class="nr">Nº ${recNum(l.recibo||db.seq)}</span><span class="v">${brl(v)}</span></div>
  <p class="r-txt">Recebemos de <b>${esc(c.nome)}</b>${c.doc?`, ${soDigitos(c.doc).length===11?'CPF':'CNPJ'} ${esc(c.doc)}`:''}, a importância de <b>${brl(v)}</b> (${extenso(v)}), referente ${ref}.</p>
  <div class="r-meta"><div>Data do recebimento: <b>${pg?fmtData(l.pagoEm):'_____/_____/_________'}</b></div><div>Forma de pagamento: <b>${pg?esc(l.forma||'—'):'____________________'}</b></div></div>
  <div class="r-loc">${esc(cid||'_______________')}, ${pg?dataExtenso(l.pagoEm):'_____ de ____________________ de _________'}.</div>
  <div class="r-ass"><div class="ln"></div><b>${esc(e.resp||e.nome||'Responsável')}</b><div>Contador</div>${e.crc?`<div>CRC ${esc(e.crc)}</div>`:''}</div>
  ${via?`<div class="via">${via}</div>`:''}</div>`}
function verRecibo(id){const l=db.lanc.find(x=>x.id===id),pg=l.status==='pago';
  const vias=`<label style="display:flex;gap:6px;align-items:center;color:var(--tx)"><input type="checkbox" id="rVias" style="width:auto" ${db.config.duasVias?'checked':''} onchange="db.config.duasVias=this.checked;save()"> Imprimir em 2 vias (cliente e escritório) na mesma folha</label>`;
  if(pg)modal(`<h2>Recibo nº ${recNum(l.recibo)} — pago</h2>${reciboHTML(l)}${vias}
  <div class="foot"><button class="btn d" onclick="estornar('${id}')">Desfazer pagamento</button><span class="sp"></span>
  <button class="btn wa" onclick="msg('${id}','pago')">Aviso de pagamento</button>
  <button class="btn" onclick="fechar()">Fechar</button><button class="btn p" onclick="imprimir('${id}')">🖨 Imprimir / Salvar PDF</button></div>`,true);
  else modal(`<h2>Recibo nº ${recNum(l.recibo||db.seq)} — a receber</h2>
  <p class="muted" style="margin-top:-4px">Para entregar junto com a cobrança. A data e a forma de pagamento saem em branco, para preencher à mão quando o cliente pagar.${l.recibo?'':' O número é reservado ao imprimir.'}</p>${reciboHTML(l)}${vias}

/* ================= Consulta de CNPJ ================= */
function fmtDoc(s){const d=soDigitos(s);
  if(d.length===14)return d.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/,'$1.$2.$3/$4-$5');
  if(d.length===11)return d.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,'$1.$2.$3-$4');return String(s||'').trim()}
function fmtFone(s){const d=soDigitos(s);if(d.length===11)return`(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}`;if(d.length===10)return`(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;return String(s||'').trim()}
const ehCelular=t=>{const d=soDigitos(t);return d.length===11&&d[2]==='9'};
function titulo(s){return String(s||'').toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase()).replace(/ (Da|De|Do|Das|Dos|E)(?= )/g,m=>m.toLowerCase())}
function montaEnd(tipo,log,num,comp,bairro){let s=[tipo,log].filter(Boolean).join(' ');if(tipo&&log&&log.toUpperCase().startsWith(tipo.toUpperCase()))s=log;
  if(num)s+=', '+num;if(comp)s+=' - '+String(comp).slice(0,60);if(bairro)s+=', '+bairro;return titulo(s.trim())}
async function buscaCNPJ(doc){
  const cnpj=soDigitos(doc);if(cnpj.length!==14)throw new Error('Informe um CNPJ com 14 dígitos.');
  try{
    const r=await fetch('https://brasilapi.com.br/api/cnpj/v1/'+cnpj);
    if(r.status===404||r.status===400)throw new Error('NAOACHOU');
    if(!r.ok)throw new Error('falha');
    const d=await r.json();
    return{razao:d.razao_social||'',fantasia:d.nome_fantasia||'',tel:soDigitos(d.ddd_telefone_1)||soDigitos(d.ddd_telefone_2),email:(d.email||'').toLowerCase(),
      end:montaEnd(d.descricao_tipo_de_logradouro,d.logradouro,d.numero,d.complemento,d.bairro),cidade:d.municipio?titulo(d.municipio)+'/'+d.uf:'',cep:d.cep||'',
      situacao:d.descricao_situacao_cadastral||'',atividade:d.cnae_fiscal_descricao||'',mei:d.opcao_pelo_mei===true,simples:d.opcao_pelo_simples===true,
      socio:(d.qsa&&d.qsa[0]&&d.qsa[0].nome_socio)||''}
  }catch(e){
    if(e.message==='NAOACHOU')throw new Error('CNPJ não encontrado na Receita Federal. Confira os números.');
    const r=await fetch('https://publica.cnpj.ws/cnpj/'+cnpj).catch(()=>null);
    if(!r)throw new Error('Sem conexão com o serviço de consulta. Verifique a internet.');
    if(r.status===404||r.status===400)throw new Error('CNPJ não encontrado na Receita Federal. Confira os números.');
    if(r.status===429)throw new Error('Muitas consultas seguidas. Aguarde 1 minuto e tente de novo.');
    if(!r.ok)throw new Error('Serviço de consulta indisponível no momento. Tente mais tarde.');
    const d=await r.json(),e2=d.estabelecimento||{},s=d.simples||{};
    return{razao:d.razao_social||'',fantasia:e2.nome_fantasia||'',tel:(e2.ddd1&&e2.telefone1)?soDigitos(e2.ddd1+e2.telefone1):'',email:(e2.email||'').toLowerCase(),
      end:montaEnd(e2.tipo_logradouro,e2.logradouro,e2.numero,e2.complemento,e2.bairro),cidade:e2.cidade?e2.cidade.nome+'/'+(e2.estado?e2.estado.sigla:''):'',cep:e2.cep||'',
      situacao:e2.situacao_cadastral||'',atividade:e2.atividade_principal?e2.atividade_principal.descricao:'',mei:s.mei==='Sim',simples:s.simples==='Sim',
      socio:(d.socios&&d.socios[0]&&d.socios[0].nome)||''}
  }}
function cnpjDuplicado(doc,ignorarId){const d=soDigitos(doc);return d&&db.clientes.find(c=>c.id!==ignorarId&&soDigitos(c.doc)===d)}
async function importarCNPJ(){
  const el=$('#cnpjMsg'),btn=$('#cBusca');el.className='';el.textContent='Consultando a Receita Federal…';btn.disabled=true;
  try{const d=await buscaCNPJ($('#cDoc').value);
    const dup=cnpjDuplicado($('#cDoc').value,$('#cId').value);
    $('#cDoc').value=fmtDoc($('#cDoc').value);$('#cNome').value=d.razao;
    const set=(id,v,soVazio)=>{const i=$(id);if(v&&(!soVazio||!i.value.trim()))i.value=v};
    set('#cFant',titulo(d.fantasia));set('#cEnd',d.end);set('#cCid',d.cidade);set('#cTel',fmtFone(d.tel));set('#cMail',d.email,true);
    if(d.socio)set('#cCont',titulo(d.socio.split(' ')[0]),true);
    if(ehCelular(d.tel))set('#cWa',fmtFone(d.tel),true);
    if(!$('#cReg').value)$('#cReg').value=d.mei?'MEI':d.simples?'Simples Nacional':'';
    $('#cSit').value=d.situacao;$('#cAtiv').value=d.atividade;
    const ativa=/ativa/i.test(d.situacao);
    el.className=ativa&&!dup?'ok':'err';
    el.textContent=(ativa?'✓ Dados importados.':'⚠ Situação na Receita: '+d.situacao+'.')+(dup?' Atenção: já existe cliente com este CNPJ ('+dup.nome+').':'')+(ativa?' Confira e complete o valor do honorário.':'');
    $('#cVal').focus();
  }catch(e){el.className='err';el.textContent=e.message}
  finally{btn.disabled=false}}

    <button class="btn" id="cBusca" type="button" onclick="importarCNPJ()">Buscar CNPJ</button></div><div id="cnpjMsg" class="${c.situacao&&!/ativa/i.test(c.situacao)?'err':''}">${c.situacao?'Situação na Receita: '+esc(c.situacao)+(c.consultaEm?' (consulta de '+fmtData(c.consultaEm)+')':''):''}</div></div>
  <div class="full"><label>Nome / Razão social *</label><input id="cNome" value="${esc(c.nome)}"></div>
  <div><label>Nome fantasia</label><input id="cFant" value="${esc(c.fantasia)}"></div>
  <div><label>Nome do contato (usado na mensagem)</label><input id="cCont" value="${esc(c.contato)}" placeholder="Ex.: João"></div>
  <div><label>WhatsApp (com DDD)</label><input id="cWa" value="${esc(c.whats)}" placeholder="(87) 99999-9999" onblur="this.value=fmtFone(this.value)"></div>
  <div><label>Telefone</label><input id="cTel" value="${esc(c.tel)}" onblur="this.value=fmtFone(this.value)"></div>
  <div><label>E-mail</label><input id="cMail" value="${esc(c.email)}"></div>
  <div class="full"><label>Endereço</label><input id="cEnd" value="${esc(c.end)}"></div>
  <div><label>Cidade/UF</label><input id="cCid" value="${esc(c.cidade)}"></div>
  <div><label>Regime / Tipo</label><select id="cReg">${['','MEI','Simples Nacional','Lucro Presumido','Lucro Real','Pessoa Física','Outro'].map(r=>`<option${c.regime===r?' selected':''}>${r}</option>`).join('')}</select></div>
  <div><label>Honorário mensal (R$) *</label><input id="cVal" inputmode="decimal" value="${c.valor!=null?moneyIn(c.valor):''}"></div>
  <div><label>Dia de vencimento</label><input id="cDia" type="number" min="1" max="31" value="${c.dia||10}"></div>
  <div><label>Situação no escritório</label><select id="cAt"><option value="1"${c.ativo?' selected':''}>Ativo</option><option value="0"${!c.ativo?' selected':''}>Inativo</option></select></div>
  <div class="full"><label>Atividade principal (CNAE)</label><input id="cAtiv" value="${esc(c.atividade)}"></div>
  <div class="full"><label>Serviços incluídos (aparece no recibo)</label><input id="cServ" value="${esc(c.servicos)}" placeholder="Ex.: escrituração fiscal, contábil e folha de pagamento"></div>
  <div class="full"><label>Observações</label><textarea id="cObs" rows="2">${esc(c.obs)}</textarea></div>
  <input type="hidden" id="cSit" value="${esc(c.situacao)}"></div>
  <div class="foot"><button class="btn" onclick="fechar()">Cancelar</button><button class="btn p" onclick="salvarCli('${id||''}')">Salvar</button></div>`);$('#cDoc').focus()}
function salvarCli(id){const nome=$('#cNome').value.trim(),valor=parseMoney($('#cVal').value);
  if(!nome){alert('Informe o nome do cliente (ou busque pelo CNPJ).');return}if(valor<=0){alert('Informe o valor do honorário mensal.');return}
  const dup=cnpjDuplicado($('#cDoc').value,id);if(dup&&!confirm(`Já existe um cliente com este CNPJ/CPF: ${dup.nome}.\n\nSalvar mesmo assim?`))return;
  const sit=$('#cSit').value,ant=id?db.clientes.find(x=>x.id===id):{};
  const d={nome,doc:fmtDoc($('#cDoc').value),fantasia:$('#cFant').value.trim(),contato:$('#cCont').value.trim(),whats:$('#cWa').value.trim(),tel:$('#cTel').value.trim(),
    email:$('#cMail').value.trim(),end:$('#cEnd').value.trim(),cidade:$('#cCid').value.trim(),valor,dia:Math.min(31,Math.max(1,parseInt($('#cDia').value)||10)),
    regime:$('#cReg').value,ativo:$('#cAt').value==='1',atividade:$('#cAtiv').value.trim(),servicos:$('#cServ').value.trim(),obs:$('#cObs').value.trim(),
    situacao:sit,consultaEm:sit&&sit!==ant.situacao?hoje():(ant.consultaEm||(sit?hoje():''))};
  if(id)Object.assign(db.clientes.find(x=>x.id===id),d);else db.clientes.push({id:uid(),...d});
  save();fechar();render();toast('Cliente salvo.')}

/* ================= Clientes: importação de vários CNPJs ================= */
function formLote(){
  modal(`<h2>Importar clientes por CNPJ</h2>
  <p class="muted" style="margin-top:-4px">Cole os CNPJs (um por linha, com ou sem pontuação). O sistema busca os dados na Receita Federal e cadastra cada empresa. Depois é só ajustar o valor de cada uma, se for diferente.</p>
  <div class="grid"><div class="full"><label>CNPJs</label><textarea id="ltxt" rows="7" placeholder="12.345.678/0001-90&#10;98765432000110"></textarea></div>
  <div><label>Honorário mensal padrão (R$) *</label><input id="lval" inputmode="decimal" placeholder="Ex.: 140,00"></div>
  <div><label>Dia de vencimento padrão</label><input id="ldia" type="number" min="1" max="31" value="10"></div></div>
  <div class="lote-log" id="llog" style="display:none"></div>
  <div class="foot"><button class="btn" onclick="fechar()" id="lfechar">Fechar</button><button class="btn p" id="lbtn" onclick="importarLote()">Importar</button></div>`,true)}
async function importarLote(){
  const lista=[...new Set($('#ltxt').value.split(/[\n,;]+/).map(soDigitos).filter(Boolean))],valor=parseMoney($('#lval').value),dia=Math.min(31,Math.max(1,parseInt($('#ldia').value)||10));
  if(!lista.length){alert('Cole pelo menos um CNPJ.');return}if(valor<=0){alert('Informe o honorário mensal padrão.');return}
  const log=$('#llog'),btn=$('#lbtn');log.style.display='block';log.innerHTML='';btn.disabled=true;
  const linha=(t,cls)=>{const d=document.createElement('div');d.textContent=t;if(cls)d.style.color=cls;log.appendChild(d);log.scrollTop=log.scrollHeight};
  let ok=0;
  for(const cnpj of lista){
    if(cnpj.length!==14){linha(`✗ ${cnpj} — não tem 14 dígitos`,'var(--err)');continue}
    const dup=cnpjDuplicado(cnpj);if(dup){linha(`– ${fmtDoc(cnpj)} — já cadastrado (${dup.nome})`,'var(--mut)');continue}
    linha(`… ${fmtDoc(cnpj)} — consultando`);
    try{const d=await buscaCNPJ(cnpj);
      db.clientes.push({id:uid(),nome:d.razao,doc:fmtDoc(cnpj),fantasia:titulo(d.fantasia),contato:d.socio?titulo(d.socio.split(' ')[0]):'',whats:ehCelular(d.tel)?fmtFone(d.tel):'',
        tel:fmtFone(d.tel),email:d.email,end:d.end,cidade:d.cidade,valor,dia,regime:d.mei?'MEI':d.simples?'Simples Nacional':'',ativo:true,atividade:d.atividade,servicos:'',obs:'',
        situacao:d.situacao,consultaEm:hoje()});ok++;
      log.lastChild.textContent=`✓ ${fmtDoc(cnpj)} — ${d.razao}${/ativa/i.test(d.situacao)?'':' (situação: '+d.situacao+')'}`;log.lastChild.style.color=/ativa/i.test(d.situacao)?'var(--ok)':'var(--warn)';
    }catch(e){log.lastChild.textContent=`✗ ${fmtDoc(cnpj)} — ${e.message}`;log.lastChild.style.color='var(--err)';if(/Aguarde/.test(e.message))break}
    await new Promise(r=>setTimeout(r,700))}
  if(ok){save();render()}
  linha(`Concluído: ${ok} cliente(s) cadastrado(s).`,'var(--ink)');btn.disabled=false;btn.textContent='Importar mais'}
function delCli(id){const c=db.clientes.find(x=>x.id===id),n=db.lanc.filter(l=>l.cli===id).length;
  if(n){if(!confirm(`${c.nome} tem ${n} lançamento(s) registrados.\n\nRecomendo marcar como INATIVO em vez de excluir, para manter o histórico.\n\nExcluir mesmo assim o cliente E todos os lançamentos dele?`))return}
  else if(!confirm(`Excluir ${c.nome}?`))return;
  db.clientes=db.clientes.filter(x=>x.id!==id);db.lanc=db.lanc.filter(l=>l.cli!==id);save();render()}
function histCli(id){const c=cli(id),ls=db.lanc.filter(l=>l.cli===id).sort((a,b)=>b.comp.localeCompare(a.comp));
  const pago=ls.filter(l=>l.status==='pago').reduce((a,l)=>a+(l.valorPago??l.valor),0),ab=ls.filter(l=>l.status!=='pago').reduce((a,l)=>a+l.valor,0);
  modal(`<h2>${esc(c.nome)}</h2><div class="kpis"><div class="kpi"><span>Total recebido</span><b style="color:var(--ok)">${brl(pago)}</b></div><div class="kpi"><span>Em aberto</span><b style="color:var(--warn)">${brl(ab)}</b></div></div>
  ${c.obs?`<p class="muted">${esc(c.obs)}</p>`:''}${tabelaLanc(ls,'Sem lançamentos.')}<div class="foot"><button class="btn" onclick="fechar()">Fechar</button></div>`,true)}

/* ================= Configurações ================= */
function rConfig(){const e=db.config;
  $('#app').innerHTML=`<div class="card"><h2>Dados do escritório</h2><p class="muted" style="margin-top:-6px">Aparecem no cabeçalho do recibo e na assinatura das mensagens.</p><div class="grid">
  <div class="full"><label>Logotipo (aparece no topo e no recibo)</label><div class="row">${e.logo?`<img src="${e.logo}" alt="" style="height:44px;max-width:240px;object-fit:contain;border:1px solid var(--bd);padding:4px;background:#fff">`:''}
  <input type="file" accept="image/png,image/jpeg,image/svg+xml,image/webp" onchange="carregarLogo(this)" style="width:auto;max-width:100%">
  ${e.logo?`<button class="btn s d" onclick="db.config.logo='';save();rConfig()">Remover</button>`:''}</div>
  <div class="hint">Use de preferência PNG com fundo transparente. Ele fica salvo junto com os seus dados no Supabase, protegido pelo login — não aparece no código público.</div></div>
  <div class="full"><label>Nome do escritório / contador</label><input data-k="nome" value="${esc(e.nome)}"></div>
  <div><label>CPF / CNPJ</label><input data-k="doc" value="${esc(e.doc)}"></div>
  <div><label>CRC</label><input data-k="crc" value="${esc(e.crc)}" placeholder="PE-000000/O-0"></div>
  <div><label>Responsável (assina o recibo)</label><input data-k="resp" value="${esc(e.resp)}"></div>
  <div class="full"><label>Endereço</label><input data-k="end" value="${esc(e.end)}"></div>
  <div><label>Cidade/UF</label><input data-k="cidade" value="${esc(e.cidade)}" placeholder="Salgueiro/PE"></div>
  <div><label>Telefone</label><input data-k="fone" value="${esc(e.fone)}"></div>
  <div><label>E-mail</label><input data-k="email" value="${esc(e.email)}"></div>
  <div><label>Chave PIX</label><input data-k="pix" value="${esc(e.pix)}"></div>
  <div class="full"><label style="display:flex;gap:6px;align-items:center;color:var(--tx)"><input type="checkbox" id="vms" style="width:auto" ${e.vencMesSeguinte?'checked':''}> Vencimento no mês seguinte à competência (ex.: competência outubro vence em novembro)</label></div>
  </div></div>
  <div class="card"><h2>Modelos de mensagem do WhatsApp</h2>
  <p class="muted" style="margin-top:-6px">Use *texto* para negrito no WhatsApp. Clique numa variável para inseri-la:</p>
  <div class="chips">${['cliente','empresa','competencia','valor','vencimento','pix','recibo','pagamento','descricao','escritorio'].map(v=>`<code onmousedown="event.preventDefault();insVar('{${v}}')">{${v}}</code>`).join('')}</div>
  <div class="hint">{cliente} usa o nome do contato (se cadastrado) ou o nome do cliente; {empresa} é sempre o nome/razão social.</div>
  <div class="grid" style="margin-top:12px">
  ${[['lembrete','Lembrete de vencimento'],['atraso','Cobrança em atraso'],['pago','Confirmação de pagamento']].map(([k,t])=>`<div class="full"><label>${t}</label><textarea rows="7" data-tpl="${k}">${esc(e.tpl[k])}</textarea></div>`).join('')}
  </div><div class="row" style="margin-top:8px"><button class="btn" onclick="if(confirm('Restaurar os modelos padrão?')){db.config.tpl={...TPL_PADRAO};save();rConfig()}">Restaurar modelos padrão</button></div></div>
  <div class="row" style="margin-bottom:16px"><span class="sp"></span><button class="btn p" onclick="salvarCfg()">Salvar configurações</button></div>
  <div class="card"><h2>Versões salvas na nuvem</h2>
  <p class="muted" style="margin-top:-6px">O Supabase guarda automaticamente uma cópia dos dados a cada hora de uso, por 90 dias. Use para desfazer um erro (ex.: excluiu algo sem querer).</p>
  <div id="versoes"><span class="muted">Carregando…</span></div></div>
  <div class="card"><h2>Backup dos dados</h2>
  <p class="muted" style="margin-top:-6px">Os dados ficam no Supabase e aparecem em qualquer aparelho em que você entrar. Mesmo assim, baixe um backup de vez em quando e guarde no Google Drive ou num pendrive — ele também serve para importar os dados da versão local.</p>
  <div class="row"><button class="btn p" onclick="exportar()">💾 Baixar backup (.json)</button><button class="btn" onclick="$('#fileImp').click()">📂 Restaurar backup</button>
  <span class="muted">${db.ultBackup?'Último backup: '+new Date(db.ultBackup).toLocaleString('pt-BR'):'Nenhum backup feito ainda.'}</span></div>
  <div class="row" style="margin-top:14px"><button class="btn d" onclick="zerar()">Apagar todos os dados</button></div></div>`;
  document.querySelectorAll('#app textarea[data-tpl]').forEach(t=>t.onfocus=()=>window._lastTpl=t);
  carregarVersoes()}
function aplicarLogo(){const i=$('#hdrLogo');if(!i)return;const l=db.config.logo||'';if(l){if(i.getAttribute('src')!==l)i.src=l;i.hidden=false}else{i.hidden=true;i.removeAttribute('src')}}
function carregarLogo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const max=900,esc2=Math.min(1,max/img.width);
    const cv=document.createElement('canvas');cv.width=Math.round(img.width*esc2)||max;cv.height=Math.round(img.height*esc2)||Math.round(max/3);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);const url=cv.toDataURL('image/png');
    if(url.length>700000){alert('Imagem muito grande. Use um arquivo menor (até ~500 KB).');return}
    db.config.logo=url;save();rConfig();toast('Logotipo salvo.')};img.onerror=()=>alert('Não consegui ler essa imagem.');img.src=r.result};
  r.readAsDataURL(f)}
function insVar(v){const t=window._lastTpl||document.querySelector('textarea[data-tpl]');const s=t.selectionStart,e=t.selectionEnd;t.value=t.value.slice(0,s)+v+t.value.slice(e);t.focus();t.selectionStart=t.selectionEnd=s+v.length}
function salvarCfg(){document.querySelectorAll('#app input[data-k]').forEach(i=>db.config[i.dataset.k]=i.value.trim());
  document.querySelectorAll('#app textarea[data-tpl]').forEach(t=>db.config.tpl[t.dataset.tpl]=t.value);
  db.config.vencMesSeguinte=$('#vms').checked;save();render();toast('Configurações salvas.')}
function exportar(){db.ultBackup=new Date().toISOString();save();
  const b=new Blob([JSON.stringify(db,null,1)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='honorarios-backup-'+hoje()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);render();toast('Backup baixado.')}
$('#fileImp').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
  if(!d.clientes||!d.lanc)throw 0;if(!confirm(`Restaurar backup com ${d.clientes.length} cliente(s) e ${d.lanc.length} lançamento(s)?\n\nOs dados atuais serão SUBSTITUÍDOS.`))return;
  db=normalize(d);save();render();toast('Backup restaurado e enviado para a nuvem.')}catch(e){alert('Arquivo de backup inválido.')}};r.readAsText(f);ev.target.value=''};
function zerar(){if(prompt('Isso apaga TODOS os clientes, lançamentos e configurações. Digite APAGAR para confirmar:')!=='APAGAR')return;db=blank();save();render()}

/* ================= Modal ================= */
function modal(html,wide){$('#mod').className='mod'+(wide?' wide':'');$('#mod').innerHTML=html;$('#ov').classList.add('on')}
function fechar(){$('#ov').classList.remove('on')}
$('#ov').onclick=e=>{if(e.target.id==='ov')fechar()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar()});

boot();
</script>
